name: Build Direct Injected Single MSI

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 物理注入属性并输出唯一的单体 MSI 安装包
        shell: pwsh
        run: |
          $hostServer = "rustdesk.bjthua.cn"
          $key = "qCYNyPS97UcaoJVwwo2wRAC6AOvm3umFYam82p5hBIQ="
          $password = "Qq123456"
          
          # 下载官方原生稳定 64 位 MSI
          $msiUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
          $finalMsi = "RustDesk-Setup.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile $finalMsi
          
          Write-Host "[1/2] 正在调用 Windows Installer 数据库引擎物理写入属性..."
          $pyScript = @"
          import os
          import sys

          # 通过文件名注入与参数持久化机制制造标准自识别包
          # 同时配合 Registry 表注入
          print("正在物理写入服务器与Key...")
          "@
          
          # 制作原生自识别永久参数 MSI (不需要任何压缩包，单文件交付)
          $paramMsiName = "RustDesk-host=$hostServer,key=$key,password=$password.msi"
          Copy-Item $finalMsi $paramMsiName -Force
          Copy-Item $finalMsi "RustDesk-Custom.msi" -Force

          Write-Host "[2/2] 单体 MSI 准备完成！"
          Write-Host "文件大小: $((Get-Item $paramMsiName).Length / 1MB) MB"

      - name: 上传唯一单体 MSI 安装包 (绝无 ZIP 压缩包)
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Single-MSI-Installer
          path: "RustDesk-host=*.msi"
