name: Build Official Standard Installer Only

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成内置专属配置的正规 Windows 安装包 (非绿色版)
        shell: pwsh
        run: |
          $hostServer = "rustdesk.bjthua.cn"
          $key = "qCYNyPS97UcaoJVwwo2wRAC6AOvm3umFYam82p5hBIQ="
          $password = "Qq123456"
          
          # 下载官方标准 64 位原生安装核心
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          
          # 官方原生安装包命名与参数烧录规范 (安装时自动向系统写入持久化服务与配置)
          $installerName = "RustDesk-Setup-host=$hostServer,key=$key,password=$password.exe"
          
          Write-Host "正在下载官方原生安装核心并烧录参数..."
          Invoke-WebRequest -Uri $url -OutFile $installerName
          
          Write-Host "🎉 官方标准安装包制作完成: $installerName"
          Write-Host "大小: $((Get-Item $installerName).Length / 1MB) MB"

      - name: 上传唯一安装包产物 (单文件安装包，绝无 ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Official-Setup-Installer
          path: "RustDesk-Setup-*.exe"
