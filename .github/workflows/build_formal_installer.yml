name: Build Pre-Unlocked Formal Setup Installer

on:
  workflow_dispatch:

jobs:
  build-formal-installer:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Inno Setup 编译器
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: 烧录预解锁配置并编译正规安装向导
        shell: pwsh
        run: |
          $hostServer = "rustdesk.bjthua.cn"
          $key = "qCYNyPS97UcaoJVwwo2wRAC6AOvm3umFYam82p5hBIQ="
          $password = "Qq123456"
          
          mkdir -p AppFiles
          $coreUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          Invoke-WebRequest -Uri $coreUrl -OutFile "AppFiles/rustdesk.exe"
          
          # 编写预置防火墙、预置受信任服务、开箱即全解锁的安装脚本
          $issContent = @"
          [Setup]
          AppName=RustDesk
          AppVersion=1.3.1
          AppPublisher=QustDesk Technology
          DefaultDirName={autopf}\RustDesk
          DefaultGroupName=RustDesk
          OutputDir=.
          OutputBaseFilename=RustDesk-Setup-Unlocked
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin

          [Files]
          Source: "AppFiles\rustdesk.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autodesktop}\RustDesk"; Filename: "{app}\rustdesk.exe"
          Name: "{autoprograms}\RustDesk"; Filename: "{app}\rustdesk.exe"

          [Registry]
          ; 物理注入永久服务器、Key与密码
          Root: HKLM; Subkey: "SOFTWARE\RustDesk\RustDesk"; ValueType: string; ValueName: "custom-rendezvous-server"; ValueData: "$hostServer"; Flags: uninsdeletekey
          Root: HKLM; Subkey: "SOFTWARE\RustDesk\RustDesk"; ValueType: string; ValueName: "key"; ValueData: "$key"; Flags: uninsdeletekey
          Root: HKLM; Subkey: "SOFTWARE\RustDesk\RustDesk"; ValueType: string; ValueName: "password"; ValueData: "$password"; Flags: uninsdeletekey
          Root: HKLM; Subkey: "SOFTWARE\RustDesk\RustDesk"; ValueType: string; ValueName: "allow-elevate"; ValueData: "N"; Flags: uninsdeletekey
          Root: HKLM; Subkey: "SOFTWARE\RustDesk\RustDesk"; ValueType: string; ValueName: "stop-service"; ValueData: "N"; Flags: uninsdeletekey

          ; 预置当前用户配置
          Root: HKCU; Subkey: "Software\RustDesk\RustDesk"; ValueType: string; ValueName: "custom-rendezvous-server"; ValueData: "$hostServer"; Flags: uninsdeletekey
          Root: HKCU; Subkey: "Software\RustDesk\RustDesk"; ValueType: string; ValueName: "key"; ValueData: "$key"; Flags: uninsdeletekey
          Root: HKCU; Subkey: "Software\RustDesk\RustDesk"; ValueType: string; ValueName: "password"; ValueData: "$password"; Flags: uninsdeletekey

          [Run]
          ; 安装阶段由安装程序一次性在后台加入 Windows 防火墙白名单，杜绝客户端运行时弹红框提权！
          Filename: "netsh"; Parameters: "advfirewall firewall add rule name=""RustDesk"" dir=in action=allow program=""{app}\rustdesk.exe"" enable=yes"; Flags: runhidden
          Filename: "netsh"; Parameters: "advfirewall firewall add rule name=""RustDesk"" dir=out action=allow program=""{app}\rustdesk.exe"" enable=yes"; Flags: runhidden
          
          ; 直接静默注册为原生系统服务 (System账户运行，天然免除所有UAC拦截)
          Filename: "{app}\rustdesk.exe"; Parameters: "--install-service"; Flags: runhidden
          Filename: "{app}\rustdesk.exe"; Description: "立即运行 RustDesk"; Flags: postinstall nowait
          "@

          [System.IO.File]::WriteAllText("unlocked_setup.iss", $issContent, [System.Text.Encoding]::UTF8)

          Write-Host "正在编译预解锁正规安装包..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" unlocked_setup.iss
          
          Write-Host "🎉 免提权免红框安装包已生成！"
          Write-Host "大小: $((Get-Item RustDesk-Setup-Unlocked.exe).Length / 1MB) MB"

      - name: 上传唯一安装程序
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Setup-Unlocked
          path: RustDesk-Setup-Unlocked.exe
