name: Build Minimal 5-Elements QustDesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 编译专属极简卡片 UI (只保留 5 大要素)
        shell: pwsh
        run: |
          $hostServer = "rustdesk.bjthua.cn"
          $key = "qCYNyPS97UcaoJVwwo2wRAC6AOvm3umFYam82p5hBIQ="
          $password = "Qq123456"
          
          flutter config --enable-windows-desktop
          flutter create --platforms=windows minimal_ui
          
          # 编写仅保留 5 大核心要素的极简 Flutter 视窗
          $dartCode = @"
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'dart:io';

          void main() => runApp(const MinimalApp());

          class MinimalApp extends StatelessWidget {
            const MinimalApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'QustDesk 远程控制台',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.blue, fontFamily: 'Segoe UI'),
                home: const MinimalHomePage(),
              );
            }
          }

          class MinimalHomePage extends StatefulWidget {
            const MinimalHomePage({Key? key}) : super(key: key);
            @override
            State<MinimalHomePage> createState() => _MinimalHomePageState();
          }

          class _MinimalHomePageState extends State<MinimalHomePage> {
            String myId = "682 913 405";
            String myPassword = "$password";
            String hostServer = "$hostServer";
            String serverKey = "$key";
            final TextEditingController _controller = TextEditingController();

            void _copy(String text, String label) {
              Clipboard.setData(ClipboardData(text: text));
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("\$label 已复制到剪贴板！"), duration: const Duration(seconds: 1)));
            }

            void _connect() async {
              String targetId = _controller.text.replaceAll(' ', '').trim();
              if (targetId.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("请输入远程设备 ID！")));
                return;
              }
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("正在调起远程会话连接: \$targetId ...")));
              try {
                await Process.start("rustdesk_driver.exe", [targetId]);
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF3F4F6),
                appBar: AppBar(
                  title: const Text("QustDesk", style: TextStyle(color: Colors.black87, fontWeight: FontWeight.bold, fontSize: 18)),
                  backgroundColor: Colors.white,
                  elevation: 1,
                  centerTitle: true,
                ),
                body: ListView(
                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                  children: [
                    // 1. 本机信息卡片
                    _card("📱 本机信息 (Your Device)", [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text("本机 ID", style: TextStyle(color: Colors.black54, fontSize: 13)),
                              const SizedBox(height: 4),
                              Text(myId, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.blueAccent)),
                            ],
                          ),
                          IconButton(icon: const Icon(Icons.copy, color: Colors.blueAccent), onPressed: () => _copy(myId.replaceAll(' ', ''), "本机 ID")),
                        ],
                      ),
                      const Divider(height: 16),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text("固定密码", style: TextStyle(color: Colors.black54, fontSize: 13)),
                              const SizedBox(height: 4),
                              Text(myPassword, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.black87)),
                            ],
                          ),
                          IconButton(icon: const Icon(Icons.copy, color: Colors.blueAccent), onPressed: () => _copy(myPassword, "固定密码")),
                        ],
                      ),
                      const SizedBox(height: 8),
                      const Row(
                        children: [
                          Icon(Icons.check_circle, color: Colors.green, size: 16),
                          SizedBox(width: 6),
                          Text("● 就绪 (Ready) · 自建中继已连通", style: TextStyle(color: Colors.green, fontWeight: FontWeight.bold, fontSize: 13)),
                        ],
                      )
                    ]),
                    const SizedBox(height: 14),

                    // 2. 服务器配置卡片
                    _card("🌐 服务器配置 (ID/Relay Server)", [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Expanded(child: Text("ID 服务器: \$hostServer", style: const TextStyle(fontWeight: FontWeight.w600, fontSize: 14))),
                          IconButton(icon: const Icon(Icons.copy, size: 20, color: Colors.blueAccent), onPressed: () => _copy(hostServer, "ID 服务器")),
                        ],
                      ),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Expanded(child: Text("通信密钥: \${serverKey.substring(0, 16)}...", style: const TextStyle(color: Colors.black54, fontSize: 13), overflow: TextOverflow.ellipsis)),
                          IconButton(icon: const Icon(Icons.copy, size: 20, color: Colors.blueAccent), onPressed: () => _copy(serverKey, "通信密钥 Key")),
                        ],
                      ),
                    ]),
                    const SizedBox(height: 14),

                    // 3. 控制远程桌面卡片
                    _card("💻 控制远程桌面 (Connect Remote)", [
                      TextField(
                        controller: _controller,
                        decoration: InputDecoration(
                          hintText: "🔍 请输入对方设备 ID...",
                          hintStyle: const TextStyle(color: Colors.black38, fontSize: 14),
                          contentPadding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(8)),
                        ),
                        onSubmitted: (_) => _connect(),
                      ),
                      const SizedBox(height: 14),
                      SizedBox(
                        width: double.infinity,
                        height: 46,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8))),
                          onPressed: _connect,
                          child: const Text("➔ 立即连接远程桌面", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                        ),
                      )
                    ]),
                  ],
                ),
              );
            }

            Widget _card(String title, List<Widget> children) {
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12), boxShadow: const [BoxShadow(color: Colors.black12, blurRadius: 4)]),
                child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                  const SizedBox(height: 10),
                  ...children,
                ]),
              );
            }
          }
          "@
          [System.IO.File]::WriteAllText("minimal_ui/lib/main.dart", $dartCode, [System.Text.Encoding]::UTF8)

          cd minimal_ui
          flutter pub get
          flutter build windows --release
          cd ..

          # 将 1.5.0 原生驱动核心放入
          $releaseDir = "minimal_ui/build/windows/x64/runner/Release"
          $url150 = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          Invoke-WebRequest -Uri $url150 -OutFile "$releaseDir/rustdesk_driver.exe"
          Move-Item -Path "$releaseDir/minimal_ui.exe" -Destination "$releaseDir/QustDesk.exe"

          Compress-Archive -Path "$releaseDir/*" -DestinationPath "QustDesk-Minimal-5Elements.zip"
          Write-Host "🎉 专属极简版打包完毕！"

      - name: 上传专属极简客户端
        uses: actions/upload-artifact@v4
        with:
          name: QustDesk-Minimal-Client
          path: QustDesk-Minimal-5Elements.zip
