name: Build Minimal 5-Elements QustDesk

on:
  workflow_dispatch:
  push:
    paths:
      - 'minimal_ui_main.dart'
      - '.github/workflows/build_minimal_ui.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Minimal UI
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows minimal_ui
          Copy-Item -Path "minimal_ui_main.dart" -Destination "minimal_ui/lib/main.dart" -Force
          cd minimal_ui
          flutter pub get
          flutter build windows --release
          cd ..
          $releaseDir = "minimal_ui/build/windows/x64/runner/Release"
          $url150 = "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe"
          Invoke-WebRequest -Uri $url150 -OutFile "$releaseDir/rustdesk_driver.exe"
          Move-Item -Path "$releaseDir/minimal_ui.exe" -Destination "$releaseDir/QustDesk.exe"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "QustDesk-Minimal-5Elements.zip"
          Write-Host "Done!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QustDesk-Minimal-Client
          path: QustDesk-Minimal-5Elements.zip
