name: Build Single Standalone EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'minimal_ui_main.dart'
      - '.github/workflows/build_minimal_ui.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Minimal App & Package Single EXE
        shell: pwsh
        run: |
          # 1. 编译 Flutter 5大要素极简主视窗
          flutter config --enable-windows-desktop
          flutter create --platforms=windows minimal_ui
          Copy-Item -Path "minimal_ui_main.dart" -Destination "minimal_ui/lib/main.dart" -Force
          cd minimal_ui
          flutter pub get
          flutter build windows --release
          cd ..
          
          $releaseDir = "minimal_ui/build/windows/x64/runner/Release"
          
          # 2. 下载微软认证 1.5.0 原生驱动核心放入
          $url150 = "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe"
          Invoke-WebRequest -Uri $url150 -OutFile "$releaseDir/rustdesk_driver.exe"
          Move-Item -Path "$releaseDir/minimal_ui.exe" -Destination "$releaseDir/QustDesk_Core.exe"

          # 3. 压缩 Release 目录所有运行文件为单一 app.7z
          & "C:\Program Files\7-Zip\7z.exe" a "app.7z" "$releaseDir\*" -mx=9

          # 4. 使用仓库自带的 7z.sfx 拼接为单一独立绿色便携可执行程序 QustDesk.exe
          cmd /c "copy /b 7z.sfx + app.7z QustDesk.exe"

          Write-Host "成功生成单一便携可执行文件 QustDesk.exe !"
          Write-Host "文件大小: $((Get-Item QustDesk.exe).Length / 1MB) MB"

          # 5. 一次性压缩打包成单一 zip
          Compress-Archive -Path "QustDesk.exe" -DestinationPath "QustDesk-Single.zip"

      - name: Upload Single EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QustDesk-Single-EXE
          path: |
            QustDesk.exe
            QustDesk-Single.zip
