name: Build Pre-Unlocked Portable EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成默认解锁网络与安全设置的绿色单文件客户端
        shell: pwsh
        run: |
          $hostServer = "rustdesk.bjthua.cn"
          $key = "qCYNyPS97UcaoJVwwo2wRAC6AOvm3umFYam82p5hBIQ="
          $password = "Qq123456"
          
          # 下载核心
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "official_core.exe"
          
          # 官方原生永久参数命名注入：
          # 加上 allow-elevate=N,stop-service=N 物理告诉引擎：无需提权，默认全权限解锁！
          $finalName = "RustDesk-host=$hostServer,key=$key,password=$password,allow-elevate=N,stop-service=N.exe"
          Copy-Item "official_core.exe" $finalName -Force
          Copy-Item "official_core.exe" "RustDesk-Portable-Unlocked.exe" -Force
          
          Write-Host "🎉 默认全解锁状态绿色便携版制作完成！"
          Write-Host "大小: $((Get-Item $finalName).Length / 1MB) MB"

      - name: 上传唯一绿色版单文件 (绝无压缩包)
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-PreUnlocked-Portable
          path: "RustDesk-host=*.exe"
