name: Build 100% Pure Official RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 获取官方原厂稳定版纯正单一可执行文件
        shell: pwsh
        run: |
          # 官方官方原厂最新稳定发布版 x86_64
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          
          # 下载并命名为官方标准名称 RustDesk.exe (什么都不改)
          Invoke-WebRequest -Uri $url -OutFile "RustDesk.exe"
          
          Write-Host "🎉 官方纯正原厂 RustDesk.exe 下载就绪！"
          Write-Host "大小: $((Get-Item RustDesk.exe).Length / 1MB) MB"

      - name: 上传唯一纯正原版 RustDesk.exe (绝无任何压缩包或附带脚本)
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Pure-Official
          path: RustDesk.exe
