name: Build Pure Official RustDesk EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成全功能官方单文件绿色版 RustDesk.exe
        shell: pwsh
        run: |
          $hostServer = "rustdesk.bjthua.cn"
          $key = "qCYNyPS97UcaoJVwwo2wRAC6AOvm3umFYam82p5hBIQ="
          $password = "Qq123456"
          
          # 下载官方原厂发布的完整稳定版核心
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "official_base.exe"
          
          # 注入完整参数
          $paramName = "RustDesk-host=$hostServer,key=$key,password=$password.exe"
          Copy-Item "official_base.exe" $paramName
          
          # 输出标准的单一文件 RustDesk.exe
          Copy-Item "official_base.exe" "RustDesk.exe"
          
          Write-Host "🎉 官方标准版打包完毕！"
          Write-Host "文件大小: $((Get-Item RustDesk.exe).Length / 1MB) MB"

      - name: 上传构建产物 (RustDesk.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Official-Release
          path: |
            RustDesk.exe
            RustDesk-host=*.exe
